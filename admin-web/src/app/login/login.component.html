<section class="login">
  <div class="card">
    <h1>Vis</h1>
    <p class="subtitle">Admin Portal</p>
    <button (click)="signIn()" [disabled]="loading" class="google-btn">
      @if (!loading) {
        <span>Continue with Google</span>
      }
      @if (loading) {
        <span>Signing in…</span>
      }
    </button>
    @if (error) {
      <p class="error">{{ error }}</p>
    }
  </div>
</section>
