spring.application.name=vis-backend
server.port=${SERVER_PORT:8080}

# Datasource
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

# Rate limit (per-Firebase-UID token bucket, Redis-backed via Bucket4j-Lettuce)
app.rate-limit.capacity=120
app.rate-limit.refill-tokens=120
app.rate-limit.refill-period=PT1M

# Firebase
vis.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH}
vis.firebase.project-id=${FIREBASE_PROJECT_ID}

# App
app.owner-name=vis
